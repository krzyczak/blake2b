name: Build StartOS Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to build
        required: true
        default: all
        type: choice
        options:
          - all
          - bitcoin-bip110
          - datum-bip110
          - mempool-guide
      architecture:
        description: Architecture to build
        required: true
        default: both
        type: choice
        options:
          - x86
          - arm
          - both

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select packages and architectures
        id: matrix
        shell: bash
        env:
          SELECTED_PACKAGE: ${{ inputs.package }}
          SELECTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const builds = [
            { package: 'bitcoin-bip110', target: 'x86', runner: 'ubuntu-latest' },
            { package: 'bitcoin-bip110', target: 'arm', runner: 'ubuntu-24.04-arm' },
            { package: 'datum-bip110', target: 'x86', runner: 'ubuntu-latest' },
            { package: 'datum-bip110', target: 'arm', runner: 'ubuntu-24.04-arm' },
            { package: 'mempool-guide', target: 'x86', runner: 'ubuntu-latest' },
          ]

          const selected = builds.filter(({ package: packageName, target }) => {
            const packageMatches =
              process.env.SELECTED_PACKAGE === 'all' ||
              process.env.SELECTED_PACKAGE === packageName
            const architectureMatches =
              process.env.SELECTED_ARCHITECTURE === 'both' ||
              process.env.SELECTED_ARCHITECTURE === target
            return packageMatches && architectureMatches
          })

          if (selected.length === 0) {
            throw new Error(
              `No builds support package=${process.env.SELECTED_PACKAGE} ` +
                `and architecture=${process.env.SELECTED_ARCHITECTURE}. ` +
                'Mempool Guide currently supports x86 only.',
            )
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify(selected)}\n`,
          )
          NODE

  build:
    name: ${{ matrix.package }} (${{ matrix.target }})
    needs: prepare-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Free disk space for image builds
        if: matrix.package == 'bitcoin-bip110' || matrix.package == 'mempool-guide'
        uses: Start9Labs/start-technologies/.github/actions/free-disk-space@master

      - name: Set up the StartOS build environment
        uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master

      - name: Check out this repository
        uses: actions/checkout@v6

      - name: Create an ephemeral package signing key
        shell: bash
        run: |
          start-cli init-key
          mkdir -p .startos
          cp ~/.startos/id.key.pem .startos/build.key.pem

      - name: Install package SDK dependencies
        working-directory: startos/${{ matrix.package }}
        run: npm ci

      - name: Type-check the package controller
        working-directory: startos/${{ matrix.package }}
        run: npm run check

      - name: Build the installable package
        working-directory: startos/${{ matrix.package }}
        env:
          RUST_BACKTRACE: '1'
          RUST_LOG: debug
        run: make ${{ matrix.target }}

      - name: Record checksums
        working-directory: startos/${{ matrix.package }}
        shell: bash
        run: sha256sum *.s9pk

      - name: Upload the installable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: startos/${{ matrix.package }}/*.s9pk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
